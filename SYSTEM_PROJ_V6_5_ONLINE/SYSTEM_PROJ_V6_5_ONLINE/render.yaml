services:
  - type: web
    name: system-proj-api
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    rootDir: SYSTEM_PROJ_V6_5_ONLINE/server
    buildCommand: pip install -r requirements.txt
    startCommand: python start_render.py
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: system-proj-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_MINUTES
        value: "60"

      - key: REFRESH_TOKEN_DAYS
        value: "30"

      - key: CORS_ORIGINS
        value: "*"

      - key: STORAGE_MODE
        value: s3

      - key: S3_ENDPOINT
        sync: false

      - key: S3_BUCKET
        sync: false

      - key: S3_ACCESS_KEY
        sync: false

      - key: S3_SECRET_KEY
        sync: false

      - key: S3_REGION
        value: auto

      - key: MASTER_ADMIN_ENABLED
        value: "true"

      - key: MASTER_ADMIN_USERNAME
        sync: false

      - key: MASTER_ADMIN_EMAIL
        sync: false

      - key: MASTER_ADMIN_BADGE
        sync: false

      - key: MASTER_ADMIN_FULL_NAME
        sync: false

      - key: MASTER_ADMIN_PASSWORD
        sync: false

      # Em plano pago o serviço não entra em idle.
      - key: KEEPALIVE_ENABLED
        value: "false"

      - key: KEEPALIVE_INTERVAL_MINUTES
        value: "14"

      - key: KEEPALIVE_URLS
        value: ""

databases:
  - name: system-proj-db
    plan: 0.1c-256mb
    region: ohio
    postgresMajorVersion: "18"
    databaseName: systemproj
    user: systemproj
